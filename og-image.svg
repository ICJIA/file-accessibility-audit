<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Page -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Brand block -->
  <rect x="0" y="0" width="720" height="630" fill="#3559e0"/>
  <text x="56" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="2.5">DOCUMENT ACCESSIBILITY CHECK</text>
  <text x="664" y="84" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="2.5">WCAG 2.1 A/AA</text>
  <text x="56" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-3">Check your</text>
  <text x="56" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-3">PDF, Word,</text>
  <text x="56" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-3">PowerPoint,</text>
  <text x="56" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-3">and Excel files</text>
  <text x="56" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-3">for accessibility</text>

  <!-- Grade block, as the report draws it: the letter in white on the brand colour -->
  <rect x="776" y="56" width="200" height="200" fill="#3559e0"/>
  <text x="792" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">GRADE</text>
  <text x="876" y="232" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="170" font-weight="800" fill="#ffffff">A</text>
  <text x="1004" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-3">92</text>
  <text x="1006" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#d4d4d4">/100</text>

  <!-- Name -->
  <rect x="776" y="318" width="368" height="5" fill="#ffffff"/>
  <!-- The site's brand mark: the outline globe from the header, at the
       name's cap height (owner request, 2026-11-25). Same geometry as
       layouts/default.vue, scaled 24 → 46. -->
  <g transform="translate(776 344) scale(1.9167)" fill="none" stroke="#7391ff" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="10"/>
    <ellipse cx="12" cy="12" rx="4.2" ry="10"/>
    <path d="M2 12h20M3.6 7h16.8M3.6 17h16.8"/>
  </g>
  <text x="836" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-2">ICJIA</text>
  <text x="776" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" letter-spacing="0.5">FILE ACCESSIBILITY AUDIT</text>
  <text x="776" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#d4d4d4">PDF · Word · PowerPoint · Excel</text>
  <text x="776" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#d4d4d4">ADA Title II · Illinois IITAA 2.1</text>

  <!-- Foot -->
  <text x="776" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1.5">AUDIT.ICJIA.APP</text>
  <text x="776" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3">Illinois Criminal Justice Information Authority</text>
</svg>
