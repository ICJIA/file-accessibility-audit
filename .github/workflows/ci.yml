name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the job token (2026-09-02 security pass). Nothing in
# this workflow writes to the repository, opens issues, or publishes
# packages — it checks out, installs, lints, builds, and tests — so the
# token it runs with can be read-only. A compromised third-party action or
# a malicious dependency's postinstall step then cannot push, tag, or edit
# releases with it.
permissions:
  contents: read

# One run per branch or pull request at a time (2026-11-24). A second push
# to the same ref makes the first run's answer irrelevant; before this, both
# ran to the end and the older one could finish last, leaving a stale result
# as the newest status. Tag refs are never cancelled: a run for a release tag
# is the record of that release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    # A normal run takes about 7 minutes. Without a limit a hung step holds a
    # runner for GitHub's default of 6 hours.
    timeout-minutes: 25
    steps:
      # Third-party actions are pinned to full commit SHAs, not moving tags
      # (2026-09-02 security pass): a tag like `v7` can be re-pointed at any
      # time by whoever controls the action's repository, a SHA cannot. The
      # trailing comment carries the human-readable version so Dependabot
      # (.github/dependabot.yml, `github-actions` ecosystem) can propose the
      # next pin when a new release appears.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm major pinned to match this repo's pnpm-lock.yaml
      # (lockfileVersion: '9.0', produced by locally-installed pnpm 10.x).
      # No `packageManager` field is added to package.json for this — that
      # field changes local corepack behavior for every contributor, which
      # is a bigger change than this CI-only pin needs.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known advisories in what production actually runs (2026-11-24). The
      # scan was a manual step of every security review; nothing stopped a
      # push that brought in a high-severity advisory. Fails on HIGH or
      # CRITICAL only — moderate and low findings are triaged by hand under
      # the dependency playbook and recorded in the security log. Needs the
      # npm registry: a registry outage fails this step, and a re-run is the
      # fix.
      - name: Dependency advisories (production, high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # api (tsc --noEmit) + web (nuxt typecheck) + cli (tsc --noEmit, added
      # 2026-11-12 — apps/cli runs through tsx everywhere and was never
      # typechecked by anything) + scripts/.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # integration.test.ts runs the real qpdf → pdfjs → scorer pipeline on
      # fixture PDFs (its header documents the qpdf prerequisite). Java is
      # NOT needed — the remediation worker is mocked. ubuntu-latest's qpdf
      # is 11.x (JSON v2), which the parser explicitly supports alongside v1.
      - name: Install qpdf
        run: sudo apt-get update -q && sudo apt-get install -y -q qpdf && qpdf --version

      # Runs all three suites (api, web, cli) via scripts/test.ts.
      - name: Test
        run: pnpm test

      # The adversarial trap battery: 100 synthetic documents with designed
      # truths, rebuilt from scratch and pushed through the real analyzer.
      # A violated truth is a DEFECT — in a sample or in the checker — and
      # fails the build, the same way it caught the whitespace-only-/Alt bug.
      # Needs qpdf (installed above); veraPDF is optional and skipped here.
      - name: Trap battery (synthetic PDF controls + twin orderings)
        run: pnpm synthetic-controls

      # The other three formats: hand-built .docx/.pptx/.xlsx traps with
      # designed truths (bold-instead-of-Heading-1, alt panels never opened,
      # unmarked header rows, "Sheet1"), plus their done-right twins and the
      # same twin-ordering rule — the flawed twin must never outscore the
      # correct one.
      - name: Trap battery (synthetic Office controls)
        run: pnpm synthetic-office-controls

      # The golden score ledger: every control's exact score, grade, and
      # per-category verdict is pinned in scripts/score-ledger.json. Any
      # drift fails until a human re-blesses the ledger in the same commit —
      # no score ever moves without a visible, deliberate decision. On CI
      # only the 100 regenerated traps are present; the real corpus rows
      # verify on dev machines and are skipped (with a count) here.
      - name: Score ledger (no score moves unblessed)
        run: pnpm score-ledger

      # The legal-basis gate (2026-08-29, the legal-only sweep): only WCAG
      # 2.1 A/AA may move a score. Every scored category sitting below 100
      # must have at least one failing WCAG criterion attributed to it in
      # the conformance verdict — a deduction the report itself cannot tie
      # to the law fails the build. This is the SiteImprove failure mode
      # caught mechanically, forever.
      - name: Legal basis (every point lost names the law it broke)
        run: pnpm legal-basis

      # Its converse (2026-08-31, after the WCAG audit of the Best practices
      # catalog): nothing the law REQUIRES may be filed under "not scored".
      # Where a best-practice row reads NOT MET on a document whose same
      # category carries a failing WCAG criterion, a person must have
      # recorded why the two are different defects. A new, unreviewed
      # pairing fails the build. Under-scoring — telling an agency it is
      # compliant when it is not — is the more damaging of the two errors,
      # and until now nothing in CI could catch it.
      - name: Best-practice basis (nothing required is filed as optional)
        run: pnpm best-practice-basis

      # Byte layout must never change a grade: every trap is rewritten by
      # qpdf (new object order, new xref) and must grade identically, digit
      # for digit. Plus determinism: sentinel traps audited 5x (2 serial +
      # 3 concurrent) must return identical results — the v1.109 timeout
      # class lived exactly here and nothing tested it.
      - name: Re-save invariance + determinism
        run: pnpm resave-invariance

      # Encoding invariance: ONE document re-emitted in every legal encoding
      # of the same meaning — attributes inline / behind a reference / as an
      # array / via a class map, values direct or indirect, role-mapped custom
      # tags, single-kid shorthand. All must return an identical verdict. This
      # is the gate that stops the recurring class of bug where a real file
      # uses a legal encoding nobody anticipated; it found class-map
      # attributes on its first run, before any document arrived.
      - name: Encoding invariance (same meaning, every legal form)
        run: pnpm encoding-invariance

      # The same gate for Word, PowerPoint and Excel (2026-10-06): one
      # document, one deck and one workbook, each re-emitted in every legal
      # encoding of the same meaning — heading/list/header-row/link/image
      # forms, language placement, true/false and every spelling of bold,
      # UTF-16, a byte order mark, numeric character references, renamed
      # prefixes, Strict, absolute targets. Each must grade identically AND
      # read identically (headings, slide order, alt text, link text, table
      # headers, contrast pairs). Its first run found seven parser defects.
      - name: Office encoding invariance (same meaning, every legal form)
        run: pnpm office-encoding-invariance

  # ---------------------------------------------------------------------
  # Browser smoke + accessibility check of the app itself (2026-11-24).
  #
  # The unit suites mount components in happy-dom and call routes
  # in-process; nothing loaded the built pages in a real browser. This job
  # builds the app, starts the API and the web server, and with headless
  # Chromium uploads a fixture PDF through the real file input, waits for
  # the grade, downloads the JSON export, and runs axe-core (WCAG 2.1 A/AA)
  # on every public page — see scripts/e2e-smoke.ts.
  #
  # A separate job, after `test`: a red unit suite should not also spend a
  # build here, and a browser flake must be tellable apart from a failing
  # test at a glance.
  #
  # No new dependency: puppeteer and @axe-core/puppeteer are already
  # dependencies of apps/api. Chromium is the build puppeteer downloads; the
  # explicit install step makes that download a named step with its own
  # error, rather than a side effect of `pnpm install` that a cached store
  # can skip. The script launches Chromium with --no-sandbox, which GitHub's
  # Ubuntu runners require.
  # ---------------------------------------------------------------------
  e2e:
    name: Browser smoke + accessibility (axe)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The upload step audits a real PDF, which needs qpdf.
      - name: Install qpdf
        run: sudo apt-get update -q && sudo apt-get install -y -q qpdf && qpdf --version

      - name: Install Chromium for puppeteer
        run: pnpm --filter api exec puppeteer browsers install chrome

      - name: Build
        run: pnpm build

      - name: Browser smoke + accessibility
        run: pnpm e2e
