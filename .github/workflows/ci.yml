name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm major pinned to match this repo's pnpm-lock.yaml
      # (lockfileVersion: '9.0', produced by locally-installed pnpm 10.x).
      # No `packageManager` field is added to package.json for this — that
      # field changes local corepack behavior for every contributor, which
      # is a bigger change than this CI-only pin needs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # integration.test.ts runs the real qpdf → pdfjs → scorer pipeline on
      # fixture PDFs (its header documents the qpdf prerequisite). Java is
      # NOT needed — the remediation worker is mocked. ubuntu-latest's qpdf
      # is 11.x (JSON v2), which the parser explicitly supports alongside v1.
      - name: Install qpdf
        run: sudo apt-get update -q && sudo apt-get install -y -q qpdf && qpdf --version

      # Runs all three suites (api, web, cli) via scripts/test.ts.
      - name: Test
        run: pnpm test

      # The adversarial trap battery: 100 synthetic documents with designed
      # truths, rebuilt from scratch and pushed through the real analyzer.
      # A violated truth is a DEFECT — in a sample or in the checker — and
      # fails the build, the same way it caught the whitespace-only-/Alt bug.
      # Needs qpdf (installed above); veraPDF is optional and skipped here.
      - name: Trap battery (100 synthetic PDF controls + twin orderings)
        run: pnpm synthetic-controls

      # The other three formats: 15 hand-built .docx/.pptx/.xlsx traps with
      # designed truths (bold-instead-of-Heading-1, alt panels never opened,
      # unmarked header rows, "Sheet1"), plus their done-right twins and the
      # same twin-ordering rule — the flawed twin must never outscore the
      # correct one.
      - name: Trap battery (15 synthetic Office controls)
        run: pnpm synthetic-office-controls

      # The golden score ledger: every control's exact score, grade, and
      # per-category verdict is pinned in scripts/score-ledger.json. Any
      # drift fails until a human re-blesses the ledger in the same commit —
      # no score ever moves without a visible, deliberate decision. On CI
      # only the 100 regenerated traps are present; the real corpus rows
      # verify on dev machines and are skipped (with a count) here.
      - name: Score ledger (no score moves unblessed)
        run: pnpm score-ledger

      # The legal-basis gate (2026-08-29, the legal-only sweep): only WCAG
      # 2.1 A/AA may move a score. Every scored category sitting below 100
      # must have at least one failing WCAG criterion attributed to it in
      # the conformance verdict — a deduction the report itself cannot tie
      # to the law fails the build. This is the SiteImprove failure mode
      # caught mechanically, forever.
      - name: Legal basis (every point lost names the law it broke)
        run: pnpm legal-basis

      # Byte layout must never change a grade: every trap is rewritten by
      # qpdf (new object order, new xref) and must grade identically, digit
      # for digit. Plus determinism: sentinel traps audited 5x (2 serial +
      # 3 concurrent) must return identical results — the v1.109 timeout
      # class lived exactly here and nothing tested it.
      - name: Re-save invariance + determinism
        run: pnpm resave-invariance

      # Encoding invariance: ONE document re-emitted in every legal encoding
      # of the same meaning — attributes inline / behind a reference / as an
      # array / via a class map, values direct or indirect, role-mapped custom
      # tags, single-kid shorthand. All must return an identical verdict. This
      # is the gate that stops the recurring class of bug where a real file
      # uses a legal encoding nobody anticipated; it found class-map
      # attributes on its first run, before any document arrived.
      - name: Encoding invariance (same meaning, every legal form)
        run: pnpm encoding-invariance
